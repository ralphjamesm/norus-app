services:
  - type: web
    name: norus-app
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python backend/run.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: NORUS_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: norus-db
          property: connectionString
      - key: NORUS_SECRET_KEY
        generateValue: true
      - key: NORUS_DOCUMENT_KEY
        generateValue: true
      - key: PUBLIC_APP_URL
        value: https://norus-app.onrender.com
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: ""
      - key: SMTP_PASSWORD
        value: ""
      - key: SMTP_FROM
        value: noreply@norus.invalid
      - key: SMTP_STARTTLS
        value: "true"
      - key: PROPERTY_EMAIL_LAS_CONDES
        value: ""
      - key: PROPERTY_EMAIL_PROVIDENCIA
        value: ""
      - key: PROPERTY_EMAIL_LUUM
        value: ""

databases:
  - name: norus-db
    databaseName: norus
    user: norus
    plan: free
