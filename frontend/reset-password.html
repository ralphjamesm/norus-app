<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#091522">
	<meta name="robots" content="noindex">
	<link rel="manifest" href="manifest.webmanifest">
	<title>Grupo Norus | Crear contraseña nueva</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/luxury.css">
</head>
<body>
	<main class="page-shell auth-shell">
		<header class="site-header">
			<a class="brand brand-link" href="index.html" aria-label="Grupo Norus, inicio"><span class="brand-mark" aria-hidden="true">N</span><span class="brand-copy"><strong>GRUPO NORUS</strong><small>Apartments &amp; Hospitality</small></span></a>
			<nav class="site-nav" aria-label="Navegación principal"><a href="index.html">Inicio</a></nav>
		</header>
		<section class="auth-layout">
			<div class="auth-story"><p class="eyebrow">SEGURIDAD DE CUENTA</p><h1>Crea una nueva contraseña.</h1><p>El enlace es temporal y solo se puede utilizar una vez.</p></div>
			<div class="auth-card">
				<p class="eyebrow">RECUPERACIÓN DE CUENTA</p><h2>Restablecer contraseña</h2>
				<form class="auth-form" data-password-reset-form action="/api/auth/password-reset/complete" method="post">
					<label for="new-password">Nueva contraseña</label>
					<input id="new-password" name="password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required>
					<button class="primary-button" type="submit">Guardar contraseña <span aria-hidden="true">→</span></button>
					<p class="form-status" role="status" aria-live="polite"></p>
				</form>
				<p class="auth-footnote"><a href="login.html">Volver a iniciar sesión</a></p>
			</div>
		</section>
		<footer class="site-footer auth-footer"><span>© Grupo Norus</span></footer>
	</main>
	<script src="assets/js/app.js" defer></script>
	<script src="assets/js/backend.js" defer></script>
</body>
</html>
